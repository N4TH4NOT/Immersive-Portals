name: Minecraft 26.2 Fabric validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and access widener
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          chmod +x gradlew
          ./gradlew build validateAccessWidener -PportalSmoke compileSmokeTestJava \
            --no-daemon --stacktrace --console=plain 2>&1 | tee build/ci/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-26.2-fabric
          if-no-files-found: error
          path: |
            build/libs/*.jar
            build/examples/*.zip
            portal-protocol/build/libs/*.jar
            dependencies/gravity/gravity-*/build/libs/*.jar
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          if-no-files-found: warn
          path: |
            build/ci/**
            **/build/reports/**
            **/build/test-results/**
            **/hs_err_pid*.log
